<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In – MyProject</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e8f5fd 0%, #caeaf8 50%, #b8dff5 100%);
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 44px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(26, 111, 181, 0.15), 0 4px 16px rgba(58, 155, 213, 0.1);
      border: 1px solid #b8dff5;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, #e07b39, #f0a070);
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: #2d2d2d;
      text-align: center;
      margin-bottom: 6px;
      text-decoration: none;
      display: block;
    }
    .logo span { color: #e07b39; }

    .tagline {
      text-align: center;
      font-size: 0.78rem;
      color: #e07b39;
      font-weight: 500;
      margin-bottom: 28px;
    }

    h2 {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f2a45;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      font-size: 0.88rem;
      color: #5a8ab0;
      margin-bottom: 28px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #0f2a45;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #b8dff5;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      color: #0f2a45;
      background: #f4faff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-group input:focus {
      border-color: #3a9bd5;
      box-shadow: 0 0 0 3px rgba(58, 155, 213, 0.15);
      background: #ffffff;
    }

    .input-group input::placeholder {
      color: #a0bfd4;
    }

    /* forgot password row */
    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -8px;
      margin-bottom: 20px;
    }
    .forgot-row a {
      font-size: 0.82rem;
      color: #3a9bd5;
      text-decoration: none;
      font-weight: 500;
    }
    .forgot-row a:hover { text-decoration: underline; }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: #e07b39;
      color: #ffffff;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.25s, transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 6px 20px rgba(224, 123, 57, 0.35);
    }

    .btn-login:hover {
      background: #c96a2a;
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(224, 123, 57, 0.4);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #b8dff5;
    }
    .divider span {
      font-size: 0.78rem;
      color: #5a8ab0;
      white-space: nowrap;
    }

    .signup-link {
      text-align: center;
      font-size: 0.88rem;
      color: #5a8ab0;
      margin-top: 20px;
    }

    .signup-link a {
      color: #e07b39;
      font-weight: 600;
      text-decoration: none;
    }

    .signup-link a:hover { text-decoration: underline; }

  </style>
</head>
<body>

<div class="card">

  <a href="/" class="logo">My<span>Project</span></a>
  <p class="tagline">Complete Course. Get Certificate.</p>

  <h2>Welcome Back 👋</h2>
  <p class="subtitle">Sign in to continue your learning journey</p>

  <form method="POST" action="{% url 'login' %}">
    {% csrf_token %}

    <div class="input-group">
      <label>Email Address</label>
      <input type="email" name="email" placeholder="Enter your email" required/>
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter your password" required/>
    </div>

    <div class="forgot-row">
      <a href="">Forgot password?</a>
    </div>

    <button type="submit" class="btn-login">Sign In</button>

  </form>

  <div class="divider"><span>don't have an account?</span></div>

  <div class="signup-link">
    <a href="{% url 'signup' %}">Create Account →</a>
  </div>

</div>

</body>
</html>
