<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  padding-top: 110px;
  font-family: 'DM Sans', sans-serif;
  background: linear-gradient(to right, #eef5fb, #c9dceb, #a9c3d8);
}

/* HEADER */
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
  height: 100px;
  background: rgba(232,245,253,0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(0,0,0,0.06);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 40px;
  box-shadow: 0 6px 25px rgba(0,0,0,0.05);
}
.logo { font-family: 'Syne',sans-serif; font-size: 2rem; font-weight: 800; text-decoration: none; color: #1c2b3a; }
.logo span { color: #e07b39; }
.logo-tagline { font-size: 0.85rem; color: #e07b39; }
nav { display: flex; gap: 8px; flex: 1; justify-content: center; }
nav a { text-decoration: none; font-size: 1rem; font-weight: 500; color: #1c2b3a; padding: 8px 16px; border-radius: 12px; transition: 0.3s; }
nav a:hover { background: rgba(30,167,255,0.15); color: #1ea7ff; }
nav a.active { background: lightblue; color: black; font-weight: 600; }
.header-right { display: flex; gap: 16px; align-items: center; }
.signin { text-decoration: none; font-size: 1rem; padding: 8px 16px; border-radius: 10px; color: #1c2b3a; font-weight: 500; }
.signin:hover { background: rgba(30,167,255,0.15); color: #1ea7ff; }
.signup { text-decoration: none; font-size: 1rem; padding: 10px 22px; border-radius: 25px; background: linear-gradient(135deg,#1ea7ff,#4facfe); color: white; font-weight: 600; }
.signup:hover { transform: translateY(-2px); }

/* VOICE BUTTON */
#voiceBtn {
  position: fixed;
  bottom: 28px;
  right: 28px;
  z-index: 99999;
  padding: 12px 22px;
  background: linear-gradient(135deg, #e74c3c, #c0392b);
  color: white;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  font-size: 15px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  box-shadow: 0 6px 20px rgba(231,76,60,0.4);
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}
#voiceBtn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(231,76,60,0.5); }
#voiceBtn.active {
  background: linear-gradient(135deg, #27ae60, #1e8449);
  box-shadow: 0 6px 20px rgba(39,174,96,0.5);
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 rgba(39,174,96,0.6); }
  70%  { box-shadow: 0 0 0 12px rgba(39,174,96,0); }
  100% { box-shadow: 0 0 0 0 rgba(39,174,96,0); }
}

/* VOICE TOAST NOTIFICATION */
#voiceToast {
  position: fixed;
  bottom: 90px;
  right: 28px;
  z-index: 99999;
  background: #1c2b3a;
  color: white;
  padding: 10px 18px;
  border-radius: 12px;
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.3s ease;
  pointer-events: none;
  max-width: 260px;
  text-align: center;
}
#voiceToast.show {
  opacity: 1;
  transform: translateY(0);
}
</style>

<!-- HEADER -->
<header>
  <div>
    <a href="{% url 'home' %}" class="logo">My<span>Project</span></a>
    <div class="logo-tagline">Complete Course. Get Certificate.</div>
  </div>
  <nav>
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'courses' %}">Courses</a>
    <a href="{% url 'languages' %}">Languages Pdfs</a>
    <!-- <a href="{% url 'roadmap' %}">Roadmap</a> -->
    <!-- <a href="{% url 'about' %}">About</a> -->
    <a href="{% url 'chatboat' %}">Chatbot</a>
  </nav>
  <div class="header-right">
    {% if user.is_authenticated %}
      <a href="{% url 'logout_page' %}" class="signup">Logout</a>
    {% else %}
      <a href="{% url 'login_page' %}" class="signin">Sign In</a>
      <a href="{% url 'signup' %}" class="signup">Sign Up</a>
    {% endif %}
  </div>
</header>

<!-- VOICE BUTTON -->
<button id="voiceBtn" onclick="toggleVoice()">🎤 Voice Control</button>

<!-- TOAST -->
<div id="voiceToast">🎙️ Listening...</div>

<script>

let recognition;
let voiceOn = false;

function isSpeechSupported() {
  return 'webkitSpeechRecognition' in window ||
         'SpeechRecognition' in window;
}

function showToast(msg, duration = 2500) {

  const toast =
  document.getElementById('voiceToast');

  toast.innerText = msg;
  toast.classList.add('show');

  setTimeout(() => {
    toast.classList.remove('show');
  }, duration);
}

function toggleVoice() {

  if (!isSpeechSupported()) {

    alert('Use Google Chrome or Edge');
    return;
  }

  voiceOn
  ? stopVoice()
  : startVoice();
}

function startVoice() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  recognition =
  new SpeechRecognition();

  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-IN';

  recognition.onstart = function () {

    voiceOn = true;

    const btn =
    document.getElementById('voiceBtn');

    btn.innerText =
    '🔴 Listening...';

    btn.classList.add('active');

    showToast(
      '🎙️ Voice Control ON',
      2500
    );
  };

  recognition.onresult =
  function (event) {

    let command = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      if (
        event.results[i].isFinal
      ) {

        command +=
        event.results[i][0]
        .transcript;
      }
    }

    command =
    command.toLowerCase()
    .replace(/[^a-z0-9\s]/g, '')
    .replace(/\s+/g, ' ')
    .trim();

    console.log(command);

    if (command !== "") {

      showToast(
        '🗣️ ' + command,
        1800
      );

      handleCommand(command);
    }
  };

  recognition.onerror =
  function (event) {

    console.log(event.error);

    if (
      event.error ===
      'not-allowed'
    ) {

      showToast(
        'Mic Permission Denied'
      );

      stopVoice();
    }
  };

  recognition.onend =
  function () {

    if (voiceOn) {

      setTimeout(() => {
        recognition.start();
      }, 300);
    }
  };

  recognition.start();
}

function stopVoice() {

  if (recognition) {
    recognition.stop();
  }

  voiceOn = false;

  const btn =
  document.getElementById('voiceBtn');

  btn.innerText =
  '🎤 Voice Control';

  btn.classList.remove(
    'active'
  );

  showToast(
    '🔇 Voice OFF'
  );
}

function handleCommand(command) {

  command =
  command.replace(
    /\s+/g,
    ' '
  ).trim();

  // HOME

  if (

    command.includes('go to home') ||
    command.includes('open home') ||
    command === 'home'

  ) {

    showToast('🏠 Opening Home');

    setTimeout(() => {

      window.location.href =
      "{% url 'home' %}";

    }, 800);
  }

  // FULL STACK PAGE

  else if (

    command.includes('open full stack development course') ||
    command.includes('full stack course') ||
    command.includes('full stack development') ||
    command.includes('full stack developer course') ||
    command.includes('fullstack course') ||
    command.includes('mern stack') ||
    command.includes('web development course')

  ) {

    showToast(
      '💻 Opening Full Stack'
    );

    setTimeout(() => {

      window.location.href =
      "{% url 'fullstackdevelopment' %}";

    }, 800);
  }

  // DATA ANALYSIS

  else if (

    command.includes('data analysis course') ||
    command.includes('open data analysis course') ||
    command.includes('data analyst course') ||
    command.includes('open data analyst course') ||
    command.includes('data analysis') ||
    command.includes('data analyst')

  ) {

    showToast(
      '📊 Opening Data Analysis'
    );

    setTimeout(() => {

      window.location.href =
      "{% url 'datanalysiscourse' %}";

    }, 800);
  }

  // DATA SCIENCE

  else if (

    command.includes('data science course') ||
    command.includes('open data science course') ||
    command.includes('data science')

  ) {

    showToast(
      '📈 Opening Data Science'
    );

    setTimeout(() => {

      window.location.href =
      "{% url 'datasciencecourse' %}";

    }, 800);
  }

  // AI & MACHINE LEARNING

  else if (

    command.includes('ai course') ||
    command.includes('open ai course') ||
    command.includes('open machine learning course') ||
    command.includes('artificial intelligence') ||
    command.includes('ai and machine learning')

  ) {

    showToast(
      '🤖 Opening AI Course'
    );

    setTimeout(() => {

      window.location.href =
      "{% url 'aiandmachinelearningcourse' %}";

    }, 800);
  }

  // PYTHON PDF

  else if (

    command.includes('python pdf') ||
    command.includes('open python pdf') ||
    command.includes('python notes') ||
    command.includes('python document') ||
    command.includes('go to python pdf')

  ) {

    showToast(
      '🐍 Opening Python PDF'
    );

    setTimeout(() => {

      window.location.href =
      "{% url 'pythonpdf' %}";

    }, 800);
  }

  // COURSES PAGE

  else if (

    command.includes('open courses') ||
    command.includes('open course') ||
    command.includes('go to courses') ||
    command.includes('show courses') ||
    command.includes('course') ||
    command === 'courses'

  ) {

    showToast(
      '📚 Opening Courses'
    );

    setTimeout(() => {

      window.location.href =
      "{% url 'courses' %}";

    }, 800);
  }

  // LANGUAGES

  else if (

    command.includes('languages') ||
    command.includes('language pdf')

  ) {

    window.location.href =
    "{% url 'languages' %}";
  }

  // ROADMAP

  else if (

    command.includes('roadmap') ||
    command.includes('open roadmap') ||
    command.includes('show roadmap')

  ) {

    showToast(
      '🗺️ Opening Roadmap'
    );

    setTimeout(() => {

      window.location.href =
      "{% url 'roadmap' %}";

    }, 800);
  }

  // ABOUT

  else if (

    command.includes('about') ||
    command.includes('about page') ||
    command.includes('open about')

  ) {

    showToast(
      'ℹ️ Opening About'
    );

    setTimeout(() => {

      window.location.href =
      "{% url 'about' %}";

    }, 800);
  }

  // CHATBOT

  else if (

    command.includes('chatbot') ||
    command.includes('open chatbot')

  ) {

    window.location.href =
    "{% url 'chatboat' %}";
  }

  // LOGIN

  else if (

    command.includes('login') ||
    command.includes('sign in')

  ) {

    window.location.href =
    "{% url 'login_page' %}";
  }

  // SIGNUP

  else if (

    command.includes('sign up') ||
    command.includes('register')

  ) {

    window.location.href =
    "{% url 'signup' %}";
  }

  // LOGOUT

  else if (

    command.includes('logout') ||
    command.includes('log out') ||
    command.includes('sign out')

  ) {

    showToast(
      '🚪 Logging Out'
    );

    setTimeout(() => {

      window.location.href =
      "{% url 'logout_page' %}";

    }, 800);
  }

  // SCROLL DOWN

  else if (

    command.includes('scroll down')

  ) {

    window.scrollBy({

      top: 400,
      behavior: 'smooth'

    });
  }

  // SCROLL UP

  else if (

    command.includes('scroll up')

  ) {

    window.scrollBy({

      top: -400,
      behavior: 'smooth'

    });
  }

  // BACK

  else if (

    command.includes('go back')

  ) {

    window.history.back();
  }

  // STOP VOICE

  else if (

    command.includes('stop voice')

  ) {

    stopVoice();
  }

  else {

    showToast(
      '❓ Command Not Found'
    );
  }
}
</script>
