<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  padding-top: 110px;
  font-family: 'DM Sans', sans-serif;
  background: linear-gradient(to right, #eef5fb, #c9dceb, #a9c3d8);
}

/* HEADER */
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
  height: 100px;
  background: rgba(232,245,253,0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(0,0,0,0.06);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 40px;
  box-shadow: 0 6px 25px rgba(0,0,0,0.05);
}
.logo { font-family: 'Syne',sans-serif; font-size: 2rem; font-weight: 800; text-decoration: none; color: #1c2b3a; }
.logo span { color: #e07b39; }
.logo-tagline { font-size: 0.85rem; color: #e07b39; }
nav { display: flex; gap: 8px; flex: 1; justify-content: center; }
nav a { text-decoration: none; font-size: 1rem; font-weight: 500; color: #1c2b3a; padding: 8px 16px; border-radius: 12px; transition: 0.3s; }
nav a:hover { background: rgba(30,167,255,0.15); color: #1ea7ff; }
nav a.active { background: lightblue; color: black; font-weight: 600; }
.header-right { display: flex; gap: 16px; align-items: center; }
.signin { text-decoration: none; font-size: 1rem; padding: 8px 16px; border-radius: 10px; color: #1c2b3a; font-weight: 500; }
.signin:hover { background: rgba(30,167,255,0.15); color: #1ea7ff; }
.signup { text-decoration: none; font-size: 1rem; padding: 10px 22px; border-radius: 25px; background: linear-gradient(135deg,#1ea7ff,#4facfe); color: white; font-weight: 600; }
.signup:hover { transform: translateY(-2px); }
</style>

<!-- HEADER -->
<header>
  <div>
    <a href="{% url 'home' %}" class="logo">My<span>Project</span></a>
    <div class="logo-tagline">Complete Course. Get Certificate.</div>
  </div>
  <nav>
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'courses' %}">Courses</a>
    <a href="{% url 'languages' %}">Languages</a>
    <a href="#">Roadmap</a>
    <a href="#">About</a>
  </nav>
  <div class="header-right">
    <a href="{% url 'login' %}" class="signin">Sign In</a>
    <a href="{% url 'signup' %}" class="signup">Sign Up</a>
  </div>
</header>
