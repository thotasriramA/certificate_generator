<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Project</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ===== BODY ===== */
body {
  margin: 0;
  padding-top: 110px; /* 100px header + 10px gap */
  font-family: 'DM Sans', sans-serif;

  background: linear-gradient(
    to right,
    #eef5fb,
    #c9dceb,
    #a9c3d8
  );
}

/* ===== HEADER ===== */
header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 9999;

  height: 100px;

  background: rgba(232, 245, 253, 0.9);
  backdrop-filter: blur(12px);

  border-bottom: 1px solid rgba(0, 0, 0, 0.06);

  display: flex;
  align-items: center;

  padding: 0 80px;

  box-shadow: 0 6px 25px rgba(0,0,0,0.05);
}

/* ===== LEFT ===== */
.header-left {
  position: relative;
  z-index: 2;
}

.logo {
  font-family: 'Syne', sans-serif;
  font-size: 2.2rem;
  font-weight: 800;
  text-decoration: none;
  color: #1c2b3a;
}

.logo span {
  color: #e07b39;
}

.logo-tagline {
  font-size: 0.95rem;
  color: #e07b39;
}

/* ===== CENTER NAV ===== */
nav {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 30px;
}

nav a {
  text-decoration: none;
  font-size: 1.2rem;
  font-weight: 500;
  color: #1c2b3a;
  padding: 8px 18px;
  border-radius: 12px;
  transition: all 0.3s ease;
}

nav a:hover {
  background: rgba(30, 167, 255, 0.15);
  color: #1ea7ff;
}

nav a.active {
  background: lightblue;
  color: black;
  font-weight: 600;
}

/* ===== RIGHT BUTTONS ===== */
.header-right {
  margin-left: auto;
  display: flex;
  gap: 16px;
}

.signin {
  text-decoration: none;
  font-size: 1.15rem;
  padding: 8px 16px;
  border-radius: 10px;
  color: #1c2b3a;
  font-weight: 500;
  transition: 0.3s;
}

.signin:hover {
  background: rgba(30, 167, 255, 0.15);
  color: #1ea7ff;
}

.signup {
  text-decoration: none;
  font-size: 1.15rem;
  padding: 10px 24px;
  border-radius: 25px;
  background: linear-gradient(135deg, #1ea7ff, #4facfe);
  color: white;
  font-weight: 600;
  transition: 0.3s;
  box-shadow: 0 5px 15px rgba(30,167,255,0.3);
}

.signup:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(30,167,255,0.4);
}

</style>
</head>

<body>

<header>

  <div class="header-left">
    <a href="{% url 'home' %}" class="logo">My<span>Project</span></a><br>
    <span class="logo-tagline">Complete Course. Get Certificate.</span>
  </div>

  <nav>
    <a href="{% url 'home' %}" class="active">Home</a>
    <a href="{% url 'courses' %}">courses</a>
    <a href="{% url 'languages' %}">Languages</a>
    <a href="#">Roadmap</a>
    <a href="#">About</a>
  </nav>

  <div class="header-right">
    <a href="{% url 'login' %}" class="signin">Sign In</a>
    <a href="{% url 'signup' %}" class="signup">Sign Up</a>
  </div>

</header>

</body>
</html>
